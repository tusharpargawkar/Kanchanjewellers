    function ReelCard({ reel, onOpenModal }) {

      const [isPlaying, setIsPlaying] = useState(false);

          videoRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(() => {
            // Auto-play policy handled
          });
        }
      };

      const handleMouseLeave = () => {

          videoRef.current.pause();
          videoRef.current.currentTime = 0;
          setIsPlaying(false);
        }
      };

                      className="px-3 py-1 rounded-full bg-pink-600 hover:bg-pink-500 text-white text-[11px] font-bold transition flex items-center gap-1"
                    >
                      <i className="fas fa-user-plus text-[9px]"></i> Follow
                    </a>
                    <button 
                      onClick={() => setActiveVideoModal(null)}
                      className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition"
                    >
                      <i className="fas fa-times"></i>
                    </button>
                  </div>
                </div>

                {/* Instagram Iframe Video Player */}
                <div className="p-3 bg-black flex justify-center">
                  <iframe 
                    src={`https://www.instagram.com/p/${activeVideoModal.id}/embed/`}
                    width="100%" 
                    height="470" 
                    frameBorder="0" 
                    scrolling="no" 
                    allowtransparency="true"
                    className="rounded-xl border border-slate-800"
                    title={activeVideoModal.title}
                  ></iframe>
                </div>

                {/* Footer Action */}
                <div className="p-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between gap-3">
                  <span className="text-xs font-medium text-slate-300 truncate">{activeVideoModal.title}</span>
                  <button 
                    onClick={() => {
                      const selected = activeVideoModal;
                      setActiveVideoModal(null);
                      handleProductSelect({ name: selected.title, purity: selected.category });
                    }}
                    className="px-4 py-2 rounded-xl gold-gradient-bg text-slate-950 font-bold text-xs uppercase tracking-wider shrink-0"
                  >
                    Inquire Design
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* JEWELRY CATALOG */}
          <section id="catalog" className="py-20 border-t border-slate-900 px-6">
            <div className="max-w-7xl mx-auto space-y-10">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <div>
                  <span className="text-xs font-mono uppercase tracking-[0.2em] text-amber-400">Exclusive Creations</span>
                  <h2 className="font-luxury text-3xl font-bold text-white">Signature Masterpieces</h2>
                  <p className="text-slate-400 text-xs sm:text-sm">916 Hallmark pure gold, bridal sets, solitaires, and 999 fine silver.</p>
                </div>

                <div className="flex flex-wrap gap-2">
                  {['all', 'gold', 'diamond', 'silver'].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setCategoryFilter(cat)}
                      className={`px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition ${
                        categoryFilter === cat 
                          ? 'gold-gradient-bg text-slate-950 shadow-md' 
                          : 'bg-slate-900 text-slate-400 border border-slate-800 hover:border-amber-500/40'
                      }`}
                    >
                      {cat === 'all' ? 'All' : cat}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                {filteredCatalog.map(product => (
                  <div key={product.id} className="group rounded-2xl bg-slate-900/40 border border-slate-800 overflow-hidden hover:border-amber-500/50 hover:-translate-y-1.5 transition-all duration-300 flex flex-col justify-between">
                    <div>
                      <div className="relative h-64 overflow-hidden bg-slate-950">
                        <img 
                          src={product.image} 
                          alt={product.name} 
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                        />
                        <span className="absolute top-3 right-3 text-[10px] font-mono uppercase px-2.5 py-1 rounded-md bg-black/80 border border-slate-800 text-amber-300">
                          {product.category}
                        </span>
                      </div>
                      <div className="p-5 space-y-2">
                        <div className="flex items-center justify-between text-xs font-mono text-amber-400">
                          <span>{product.purity}</span>
                          <span className="text-slate-500 text-[11px]">{product.weight}</span>
                        </div>
                        <h3 className="font-luxury text-lg font-bold text-white group-hover:text-amber-300 transition-colors">{product.name}</h3>
                        <p className="text-xs text-slate-400 leading-relaxed">{product.desc}</p>
                      </div>
                    </div>
                    <div className="p-5 pt-0">
                      <button 
                        onClick={() => handleProductSelect(product)}
                        className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-amber-500 hover:text-slate-950 font-bold text-xs uppercase tracking-wider text-slate-200 transition flex items-center justify-center gap-2"
                      >
                        <i className="fas fa-tag text-[11px]"></i> Inquire Custom Price
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* VERIFIED REVIEWS */}
          <section id="reviews" className="py-20 border-t border-slate-900 bg-[#08090d] px-6">
            <div className="max-w-6xl mx-auto space-y-10">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <div>
                  <span className="text-xs font-mono uppercase tracking-[0.2em] text-amber-400">Local Reputation</span>
                  <h2 className="font-luxury text-3xl font-bold text-white">Google Customer Reviews</h2>
                  <p className="text-slate-400 text-xs sm:text-sm">Rated by our valued customers across Kopar Khairane & Navi Mumbai.</p>
                </div>
                <div className="flex items-center gap-3 bg-slate-900 border border-slate-800 px-4 py-2.5 rounded-xl">
                  <i className="fab fa-google text-red-500 text-xl"></i>
                  <div>
                    <div className="flex items-center gap-1 text-amber-400 text-xs">
                      <i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i>
                      <span className="text-white font-bold ml-1">5.0 / 5.0</span>
                    </div>
                    <span className="text-[10px] text-slate-400">Verified Local Business</span>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {config.reviews.map((rev, i) => (
                  <div key={i} className="p-6 rounded-2xl bg-slate-900/40 border border-slate-800 flex flex-col justify-between space-y-4">
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <div className="flex text-amber-400 text-xs gap-0.5">
                          <i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i>
                        </div>
                        <span className="text-[10px] font-mono text-slate-500">{rev.date}</span>
                      </div>
                      <p className="text-xs sm:text-sm text-slate-300 italic leading-relaxed">"{rev.text}"</p>
                    </div>
                    <div className="pt-3 border-t border-slate-800/80">
                      <p className="text-xs font-bold text-white">{rev.name}</p>
                      <p className="text-[10px] text-slate-500 font-mono">Google Verified Reviewer</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* VISIT STORE & INQUIRY FORM */}
          <section id="consultation" className="py-20 border-t border-slate-900 px-6">
            <div className="max-w-6xl mx-auto space-y-12">
              <div className="text-center space-y-2 max-w-xl mx-auto">
                <span className="text-xs font-mono uppercase tracking-[0.2em] text-amber-400">Showroom Visit & Inquiries</span>
                <h2 className="font-luxury text-3xl font-bold text-white">Visit Kanchan Jewellers</h2>
                <p className="text-slate-400 text-xs sm:text-sm">Visit our Kopar Khairane store for live hallmark testing, old gold exchange, and custom bridal orders.</p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                {/* Store Location & Map */}
                <div className="lg:col-span-5 space-y-6">
                  <div className="p-6 rounded-2xl bg-slate-900/50 border border-slate-800 space-y-4">
                    <h3 className="font-luxury text-lg font-bold text-white flex items-center gap-2">
                      <i className="fas fa-location-dot text-rose-500"></i> Showroom Address
                    </h3>
                    <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                      {config.address}
                    </p>
                    <div className="space-y-2 pt-2 text-xs font-mono text-slate-400">
                      <div><i className="fas fa-clock text-amber-400 mr-2"></i>Mon – Sun: 10:00 AM – 9:30 PM</div>
                      <div><i className="fas fa-phone text-emerald-400 mr-2"></i>{config.phone}</div>
                    </div>
                    <div className="pt-2">
                      <button 
                        onClick={openWhatsApp}
                        className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-wider transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-950"
                      >
                        <i className="fab fa-whatsapp text-sm"></i> Chat on WhatsApp
                      </button>
                    </div>
                  </div>

                  <div className="h-60 rounded-2xl overflow-hidden border border-slate-800">
                    <iframe 
                      title="Kanchan Jewellers Location Map"
                      width="100%" 
                      height="100%" 
                      style={{ border: 0, filter: 'invert(90%) hue-rotate(180deg) contrast(90%)' }} 
                      loading="lazy" 
                      allowFullScreen 
                      referrerPolicy="no-referrer-when-downgrade" 
                      src="https://maps.google.com/maps?q=Kanchan%20Jewellers,%20Sector%207,%20Kopar%20Khairane,%20Navi%20Mumbai&t=&z=14&ie=UTF8&iwloc=&output=embed">
                    </iframe>
                  </div>
                </div>

                {/* Consultation Form */}
                <div className="lg:col-span-7">
                  <div className="p-8 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-6">
                    <h3 className="font-luxury text-xl font-bold text-white">Send Price / Custom Order Inquiry</h3>

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">Your Name</label>
                          <input 
                            type="text" 
                            required 
                            placeholder="Full Name"
                            value={formData.name}
                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                            className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 text-xs transition" 
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">WhatsApp / Phone</label>
                          <input 
                            type="tel" 
                            required 
                            placeholder="e.g. 9876543210"
                            value={formData.phone}
                            onChange={(e) => setFormData({...formData, phone: e.target.value})}
                            className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 text-xs transition" 
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                        <input 
                          type="email" 
                          required 
                          placeholder="email@example.com"
                          value={formData.email}
                          onChange={(e) => setFormData({...formData, email: e.target.value})}
                          className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 text-xs transition" 
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">Inquiry / Design Preference</label>
                        <textarea 
                          rows="4" 
                          required 
                          placeholder="Specify the design, metal weight preference, or wedding schedule..."
                          value={formData.message}
                          onChange={(e) => setFormData({...formData, message: e.target.value})}
                          className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 text-xs transition"
                        ></textarea>
                      </div>

                      <div className="flex flex-col sm:flex-row gap-3 pt-2">
                        <button 
                          type="submit" 
                          disabled={formStatus.sending}
                          className="flex-1 py-3.5 px-6 rounded-xl gold-gradient-bg text-slate-950 font-bold text-xs uppercase tracking-widest hover:brightness-110 transition flex items-center justify-center gap-2"
                        >
                          {formStatus.sending ? 'Submitting...' : 'Send Inquiry Message'}
                          <i className="fas fa-paper-plane text-xs"></i>
                        </button>
                        <button 
                          type="button" 
                          onClick={openWhatsApp}
                          className="py-3.5 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-widest transition flex items-center justify-center gap-2"
                        >
                          <i className="fab fa-whatsapp"></i> Send via WhatsApp
                        </button>
                      </div>

                      {formStatus.message && (
                        <div className={`p-3 rounded-xl text-xs text-center font-medium ${formStatus.error ? 'bg-rose-950/80 text-rose-300 border border-rose-800' : 'bg-emerald-950/80 text-emerald-300 border border-emerald-800'}`}>
                          {formStatus.message}
                        </div>
                      )}
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="py-10 border-t border-slate-900 bg-black text-center text-xs text-slate-500 space-y-3">
            <p className="font-luxury tracking-widest text-slate-300 font-bold uppercase">Kanchan Jewellers • Kopar Khairane</p>
            <p>© 2026 Kanchan Jewellers. All gold and silver market prices displayed are indicative spot estimates.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
